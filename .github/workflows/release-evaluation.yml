name: Release evaluation foundation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-evaluation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deterministic-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      AGRONOMY_AGENT_PRIVATE_KNOWLEDGE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-phase4-ci.txt
      - name: Install deterministic evaluation dependencies
        run: |
          python -m pip install --requirement requirements-phase4-ci.txt
          python -m pip install --editable .
          python -m pip install huggingface_hub==1.33.0
      - name: Run focused foundation contracts
        run: |
          python -m pytest -q \
            tests/test_release_evaluation.py \
            tests/test_release_eval_executor.py \
            tests/test_release_eval_analysis.py \
            tests/test_release_eval_runner.py \
            tests/test_release_eval_reanalysis.py \
            tests/test_offline_retrieval_scoring.py \
            tests/test_evaluation_suite_inventory.py
      - name: Run all required deterministic foundation components
        run: |
          python scripts/run_release_evaluation.py \
            --profile ci --run-id "ci-${{ github.run_id }}-${{ github.run_attempt }}" \
            --output-dir "$RUNNER_TEMP/release-evaluation-foundation"
      - name: Show engineering aggregate and domain disposition
        if: always()
        run: |
          summary="$RUNNER_TEMP/release-evaluation-foundation/public-summary.json"
          if test -f "$summary"; then
            cat "$summary"
          fi
      - name: Retain synthetic development observations and failure logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evaluation-foundation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-evaluation-foundation/
          if-no-files-found: warn
          include-hidden-files: false
          retention-days: 14
