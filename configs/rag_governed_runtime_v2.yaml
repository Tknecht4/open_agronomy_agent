# Active release profile for the immutable 2026-08-14 Canadian master corpus.
# Historical benchmark profiles remain frozen and are not product-selectable.
retrieval:
  top_k: 7
  min_score: 0.03
  corpus_policy_manifest: data/manifests/runtime_corpus_policy_v2.json
  corpus_paths:
    - data/seed/agronomy_rag_corpus.jsonl
    - data/seed/boundary_rag_corpus.jsonl
    - data/derived/rag/soilwise_rag_corpus.jsonl
    - data/derived/rag/curated_canada/releases/2026-08-14/shards/context_only-canada-offline-master-0001.jsonl
    - data/derived/rag/curated_canada/releases/2026-08-14/shards/requires_live_authority-canada-offline-master-0001.jsonl
    - data/derived/rag/nrcs_esd_rag_corpus_compact_v2.jsonl
  graph_paths:
    - data/seed/agronomy_knowledge_graph.json
    - data/derived/rag/soilwise_knowledge_graph.json
  require_graph_manifests: true
private_knowledge:
  enabled: true
  required: false
  manifest_path: data/derived/private_knowledge/manifest.json
tools:
  label_guard: true
  fertility_guard: true
  weather_guard: true
  field_data_guard: true
agent_runtime:
  mode: agno
  agno_enabled: true
agno:
  version_pin: ">=2.6,<2.7"
  knowledge:
    default_base: agronomy_public
    contents_table: agno_knowledge_contents
    vector_table: agno_knowledge_vectors
    search_type: hybrid
    embedder_profile: local_default
    reranker: coverage
  retrieval:
    top_k: 7
    final_context_k: 6
    enable_agentic_search: true
    max_agentic_subqueries: 2
    agentic_candidate_multiplier: 2
    min_agentic_candidates: 16
    use_custom_retriever: true
