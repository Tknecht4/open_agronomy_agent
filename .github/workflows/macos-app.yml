name: Mac desktop candidate

on:
  pull_request:
    paths:
      - ".github/workflows/macos-app.yml"
      - "macos_app/**"
      - "scripts/build_macos_app.py"
      - "scripts/native_app_licenses.py"
      - "LICENSE"
      - "NOTICE"
      - "LICENSES/**"
      - "THIRD_PARTY_NOTICES.md"
      - "pyproject.toml"
      - "scripts/smoke_macos_app.py"
      - "scripts/smoke_macos_first_run.py"
      - "scripts/smoke_macos_launcher.py"
      - "scripts/smoke_macos_offline.py"
      - "scripts/run_cockpit.py"
      - "src/agronomy_agent/**"
      - "frontend/**"
      - "configs/**"
      - "!configs/public_repository_manifest.json"
      - "!configs/github_repository_policy.json"
      - "data/**"
      - "requirements/requirements-macos-app-*.txt"
      - "requirements/requirements-container.txt"
      - "requirements/requirements-security.txt"
  workflow_dispatch:
    inputs:
      run_native_candidate:
        description: "Build the main Mac candidate and run real model smoke checks"
        type: boolean
        default: false
      verify_native_licenses:
        description: "Build and verify native redistribution licences without model downloads"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.workflow }}-${{ github.ref }}-${{ inputs.run_native_candidate == true }}-${{ inputs.verify_native_licenses == true }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_native_licenses == true && 'Mac native licensing' || github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref == 'refs/heads/main' && 'Mac native candidate (manual)' || 'Mac source contracts' }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Reject native qualification outside main
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref != 'refs/heads/main'
        run: |
          echo "Native qualification requires an explicitly requested main run." >&2
          exit 1
      - name: Set up Python 3.12
        run: |
          brew update
          brew install python@3.12
          brew upgrade python@3.12
          "$(brew --prefix python@3.12)/bin/python3.12" -c \
            'import sys; assert sys.version.split()[0] == "3.12.15", "Python source registry requires review"'
          "$(brew --prefix python@3.12)/bin/python3.12" -m venv "$RUNNER_TEMP/native-python"
          echo "$RUNNER_TEMP/native-python/bin" >> "$GITHUB_PATH"
      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Record builder capacity
        run: |
          uname -sm
          sw_vers -productVersion
          df -h .
      - name: Install pinned candidate dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c requirements/requirements-macos-app-constraints.txt -r requirements/requirements-macos-app-runtime.txt
          python -m pip install --editable .
          python -m pip install -r requirements/requirements-macos-app-build.txt
          python -m pip install -c requirements/requirements-macos-app-constraints.txt pytest pytest-xdist
      - name: Audit installed desktop Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install --requirement requirements/requirements-security.txt
          python -m pip list --format=freeze --exclude agronomy-agent > "$RUNNER_TEMP/installed-dependencies.txt"
          test -s "$RUNNER_TEMP/installed-dependencies.txt"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip_audit \
            --requirement "$RUNNER_TEMP/installed-dependencies.txt" \
            --no-deps --disable-pip --strict --progress-spinner off
      - name: Install frontend build dependencies
        run: npm ci
        working-directory: frontend
      - name: Verify desktop source contracts
        run: |
          PYTHONPATH=src python -m pytest -q -n 0 \
            tests/test_macos_app_package.py tests/test_native_app_licenses.py tests/test_project_licensing.py tests/test_runtime_paths.py \
            tests/test_desktop_local_auth.py tests/test_local_runtime_boundaries.py \
            tests/test_run_cockpit_cleanup.py tests/test_field_lan_launch.py
          cd frontend
          npm run typecheck
          npm test
      - name: Build ad hoc Mac candidate
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref == 'refs/heads/main'
        run: |
          mkdir -p outputs/macos
          python scripts/build_macos_app.py --preflight \
            --output "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app"
          python scripts/build_macos_app.py \
            --output "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app"
      - name: Build and verify native distribution licences
        if: github.event_name == 'workflow_dispatch' && inputs.verify_native_licenses == true && inputs.run_native_candidate != true
        run: |
          mkdir -p outputs/macos
          python scripts/build_macos_app.py --preflight \
            --output "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app"
          python scripts/build_macos_app.py \
            --output "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "outputs/macos/Open Agronomy.app" "outputs/macos/native-license-candidate.zip"
      - name: Preserve native licence evidence
        if: github.event_name == 'workflow_dispatch' && (inputs.verify_native_licenses == true || inputs.run_native_candidate == true)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-licence-evidence
          path: |
            outputs/macos/native-license-candidate.zip
            outputs/macos/*.build.json
            outputs/macos/Open Agronomy.app/Contents/Resources/legal/inventory.json
          retention-days: 14
      - name: Smoke native first-run model installation
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref == 'refs/heads/main'
        run: |
          python -m scripts.smoke_macos_first_run \
            --app "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app" \
            --state-root "$HOME/Library/Application Support/OpenAgronomyAgent/desktop" \
            --report "$GITHUB_WORKSPACE/outputs/macos/first-run-smoke.json"
      - name: Smoke installed backend and pinned local model
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref == 'refs/heads/main'
        run: |
          python scripts/smoke_macos_app.py \
            --app "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app" \
            --state-root "$HOME/Library/Application Support/OpenAgronomyAgent/desktop" \
            --preprovisioned \
            --report "$GITHUB_WORKSPACE/outputs/macos/smoke.json"
      - name: Smoke native launcher, browser pairing, Quit, and reopen
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref == 'refs/heads/main'
        run: |
          python scripts/smoke_macos_launcher.py \
            --app "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app" \
            --state-root "$HOME/Library/Application Support/OpenAgronomyAgent/desktop" \
            --backend-report "$GITHUB_WORKSPACE/outputs/macos/smoke.json" \
            --report "$GITHUB_WORKSPACE/outputs/macos/launcher-smoke.json"
      - name: Smoke local answer with public egress denied
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref == 'refs/heads/main'
        run: |
          python -m scripts.smoke_macos_offline \
            --app "$GITHUB_WORKSPACE/outputs/macos/Open Agronomy.app" \
            --state-root "$HOME/Library/Application Support/OpenAgronomyAgent/desktop" \
            --report "$GITHUB_WORKSPACE/outputs/macos/offline-smoke.json"
      - name: Verify signature and archive candidate in runner
        if: github.event_name == 'workflow_dispatch' && inputs.run_native_candidate == true && github.ref == 'refs/heads/main'
        run: |
          codesign --verify --deep --strict "outputs/macos/Open Agronomy.app"
          ditto -c -k --sequesterRsrc --keepParent \
            "outputs/macos/Open Agronomy.app" \
            "outputs/macos/open-agronomy-macos-app.zip"
          shasum -a 256 "outputs/macos/open-agronomy-macos-app.zip"
