name: Documentation

on:
  pull_request:
    paths:
      - ".github/workflows/docs.yml"
      - "**/README.md"
      - "configs/public_repository_manifest.json"
      - "configs/open_agronomy_benchmark_v2*.json"
      - "configs/schemas/benchmark_v2_case.schema.json"
      - "data/eval/open_agronomy_benchmark_v2*"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/check_public_docs.py"
      - "scripts/audit_open_agronomy_benchmark_v2.py"
      - "src/agronomy_agent/benchmark_v2_metrics.py"
      - "src/agronomy_agent/capability_registry.py"
      - "src/agronomy_agent/agno_runtime/knowledge_graph.py"
      - "src/agronomy_agent/local_tools.py"
      - "src/agronomy_agent/skill_registry.py"
      - "tests/test_public_docs.py"
      - "tests/test_benchmark_v2*.py"
      - "tests/test_open_agronomy_benchmark_v2*.py"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docs.yml"
      - "**/README.md"
      - "configs/public_repository_manifest.json"
      - "configs/open_agronomy_benchmark_v2*.json"
      - "configs/schemas/benchmark_v2_case.schema.json"
      - "data/eval/open_agronomy_benchmark_v2*"
      - "docs/**"
      - "mkdocs.yml"
      - "requirements-docs.txt"
      - "scripts/check_public_docs.py"
      - "scripts/audit_open_agronomy_benchmark_v2.py"
      - "src/agronomy_agent/benchmark_v2_metrics.py"
      - "src/agronomy_agent/capability_registry.py"
      - "src/agronomy_agent/agno_runtime/knowledge_graph.py"
      - "src/agronomy_agent/local_tools.py"
      - "src/agronomy_agent/skill_registry.py"
      - "tests/test_public_docs.py"
      - "tests/test_benchmark_v2*.py"
      - "tests/test_open_agronomy_benchmark_v2*.py"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install pinned documentation dependencies
        run: python -m pip install --requirement requirements-docs.txt
      - name: Audit links, capability declarations, and publication scope
        run: PYTHONPATH=src python scripts/check_public_docs.py
      - name: Verify claim-ineligible Benchmark v2 design contract
        run: python scripts/audit_open_agronomy_benchmark_v2.py
      - name: Build documentation strictly
        run: mkdocs build --strict
      - name: Audit rendered Pages artifact
        run: PYTHONPATH=src python scripts/check_public_docs.py --site-dir build/docs-site
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs-site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy protected default-branch artifact
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
