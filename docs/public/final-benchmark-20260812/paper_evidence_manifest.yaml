paper:
  title_working: "A Local-First Evidence-Governed Agronomy Agent: Controlled Evaluation on Canadian Field Questions"
  target: "Pre-conference technical paper, fewer than 10 pages"
  main_tex: "main.tex"
  status: "complete and visually validated"

claim_spine:
  problem: "Private offline language models lack field facts, regional authority, provenance, and dependable arithmetic needed for actionable agronomy."
  gap: "Model-only comparisons cannot identify whether behavior changes arise from instructions, field context, governed knowledge, tools, or the generator itself."
  insight: "Treat the model as a replaceable component and evaluate the surrounding evidence system through frozen causal arms."
  primary_evidence: "A 3-model by 4-arm response matrix over 241 frozen Canadian development cases with exact response, context, identity, trace, and judgment retention."
  boundary: "Project-authored cases and an uncalibrated LLM judge do not establish agronomist equivalence, Canadian population validity, or field outcomes."
  consequence: "The round can show where the governed harness changes model behavior and objective task completion, while preserving the evidence needed for later blinded expert review."

claims:
  - id: "C1"
    manuscript_location: "System architecture"
    claim: "The release implements a local-first governed path that separates field truth, decisive guidance, context, and quarantined material."
    claim_type: "methodological"
    evidence:
      artifacts:
        - path: "../architecture.md"
          description: "Canonical request path and trust boundary."
        - path: "public_repository_receipt_rc1.json"
          description: "Frozen public-release file and checksum receipt for the evaluated RC1 boundary."
      statistics:
        metric: "release receipt integrity"
        unit_of_analysis: "repository file"
        uncertainty: "not applicable"
      citations:
        - key: "lewis2020rag"
        - key: "soilwisekg2025"
      display_items: []
    limitations:
      - "A policy-governed architecture does not prove agronomic correctness."
    release_boundary: "public"

  - id: "C2"
    manuscript_location: "Results / Figure 1 / Table 1"
    claim: "The four-arm matrix separates raw model, kernel, structured field-context, and governed knowledge-orchestration effects for three model profiles."
    claim_type: "descriptive"
    evidence:
      artifacts:
        - path: "source_data/final_validation_receipt.json"
          description: "Integrity, count, and checksum receipt for the local response-level database, which is not distributed through Git."
        - path: "source_data/arm_lane_summary.csv"
          description: "Paper-ready stratified results generated only after matrix completeness validation."
        - path: "source_data/paired_semantic_deltas.csv"
          description: "Paired arm-minus-raw deltas with fixed-suite case-bootstrap intervals."
      statistics:
        metric: "advisory semantic score and deterministic calculation accuracy"
        unit_of_analysis: "benchmark case"
        uncertainty: "95 percent case-bootstrap interval with 10,000 draws for semantic means and paired deltas"
      citations:
        - key: "zheng2023judge"
        - key: "wataoka2024selfpreference"
      display_items:
        - "fig:main-result"
        - "tab:benchmark"
    limitations:
      - "Automated semantic judgments are advisory and cannot promote a model."
      - "Calculation accuracy is reported separately and not judged semantically."
    release_boundary: "generated locally; response database excluded from Git"

  - id: "C3"
    manuscript_location: "Results / external transfer"
    claim: "A single frozen finalist run on 256 held-out AgroQA questions provides a non-Canadian transfer diagnostic without contaminating the internal suite."
    claim_type: "descriptive"
    evidence:
      artifacts:
        - path: "../../../data/eval/open_agronomy_external_agroqa_v1_manifest.json"
          description: "Frozen external-set provenance, hash, licence, and no-mixing policy."
        - path: "source_data/external_finalist_summary.json"
          description: "Completed one-time finalist diagnostic linked to the pre-exposure finalist freeze."
      statistics:
        metric: "normalized reference-token overlap diagnostic"
        unit_of_analysis: "external question"
        uncertainty: "descriptive only"
      citations:
        - key: "omara2023agroqa"
      display_items: []
    limitations:
      - "Ugandan source geography and un-revalidated published answers prevent Canadian validation claims."
    release_boundary: "public source questions; generated answers local"

display_items:
  - id: "fig:main-result"
    kind: "figure"
    question_answered: "How do model identity and system arm jointly change advisory semantic quality and objective calculation accuracy?"
    source_data: "source_data/arm_lane_summary.csv"
    generator: "scripts/analyze_final_benchmark.py"
    notes: "Vector PDF; semantic and objective panels retain separate metric authority."
  - id: "tab:benchmark"
    kind: "table"
    question_answered: "What are the raw and governed-agent results, paired change, objective accuracy, and latency for each model?"
    source_data: "source_data/arm_lane_summary.csv; source_data/paired_semantic_deltas.csv; source_data/resource_summary.csv"
    notes: "Generated after the canonical 2,892-response completeness gate."

reproducibility:
  code_repository: "https://github.com/Tknecht4/open_agronomy_agent"
  code_commit: "76644dcab85ac635cb9f976ff6c769b4a6cd4da8"
  data_availability: "Redistributable governed corpus and frozen evaluation contracts are in the public repository; generated benchmark databases and model weights are separate artifacts."
  environment: "Python 3.12.0; MLX 0.31.2; MLX-LM 0.31.3; macOS 27.0 build 26A5388g"
  seeds_or_randomization: "Generation is deterministic per model profile where supported; case bootstrap uses the 20260811 seed family."
  hardware: "Mac mini Mac16,10; Apple M4 10-core CPU; 16 GB unified memory"
  known_irreproducible_steps:
    - "Luna High candidate and judge execution uses a versioned remote service whose exact server weights are not exposed."

validation:
  reader_experience_pass: "pass; all four final PDF pages visually inspected on 2026-08-12"
  rendered_pdf_or_contact_sheet: "pass; final pages in visual_qa/pdf_pages_final4"
  clean_archive_compile: "pass; packaged source compiled independently with Tectonic"

residual_blockers:
  - "Independent blinded agronomist review remains required before any reliability or promotion claim."
  - "The benchmark path did not invoke the registered calculator; this is preserved as a post-round orchestration repair."
  - "The held-out AgroQA result is geographically mismatched and cannot validate Canadian agronomic performance."
