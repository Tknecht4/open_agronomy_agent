services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agronomy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-agronomy_agent}
    volumes:
      - phase6_postgres:/var/lib/postgresql/data
      - ./plans/agronomy_agent_phase4_hosted_platform_packet_final/phase4_postgres_schema_starter.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-agronomy} -d $${POSTGRES_DB:-agronomy_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - phase6_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    environment:
      AGRONOMY_AGENT_DB_BACKEND: postgres
      AGRONOMY_AGENT_DATABASE_URL: ${AGRONOMY_AGENT_DATABASE_URL:?set AGRONOMY_AGENT_DATABASE_URL}
      AGRONOMY_AGENT_ALLOW_LOCAL_DEV_AUTH: "false"
      AGRONOMY_AGENT_JWT_ISSUER: ${AGRONOMY_AGENT_JWT_ISSUER:?set AGRONOMY_AGENT_JWT_ISSUER}
      AGRONOMY_AGENT_JWT_AUDIENCE: ${AGRONOMY_AGENT_JWT_AUDIENCE:?set AGRONOMY_AGENT_JWT_AUDIENCE}
      AGRONOMY_AGENT_JWT_JWKS_URL: ${AGRONOMY_AGENT_JWT_JWKS_URL:?set AGRONOMY_AGENT_JWT_JWKS_URL}
      AGRONOMY_AGENT_OIDC_AUTHORIZATION_ENDPOINT: ${AGRONOMY_AGENT_OIDC_AUTHORIZATION_ENDPOINT:?set AGRONOMY_AGENT_OIDC_AUTHORIZATION_ENDPOINT}
      AGRONOMY_AGENT_OIDC_TOKEN_ENDPOINT: ${AGRONOMY_AGENT_OIDC_TOKEN_ENDPOINT:?set AGRONOMY_AGENT_OIDC_TOKEN_ENDPOINT}
      AGRONOMY_AGENT_OIDC_CLIENT_ID: ${AGRONOMY_AGENT_OIDC_CLIENT_ID:?set AGRONOMY_AGENT_OIDC_CLIENT_ID}
      AGRONOMY_AGENT_OIDC_CLIENT_SECRET: ${AGRONOMY_AGENT_OIDC_CLIENT_SECRET:?set AGRONOMY_AGENT_OIDC_CLIENT_SECRET}
      AGRONOMY_AGENT_OIDC_REDIRECT_URI: ${AGRONOMY_AGENT_OIDC_REDIRECT_URI:?set AGRONOMY_AGENT_OIDC_REDIRECT_URI}
      AGRONOMY_AGENT_OIDC_SESSION_SECRET: ${AGRONOMY_AGENT_OIDC_SESSION_SECRET:?set AGRONOMY_AGENT_OIDC_SESSION_SECRET}
      AGRONOMY_AGENT_OIDC_LOGOUT_ENDPOINT: ${AGRONOMY_AGENT_OIDC_LOGOUT_ENDPOINT:-}
      AGRONOMY_AGENT_OIDC_POST_LOGOUT_REDIRECT_URI: ${AGRONOMY_AGENT_OIDC_POST_LOGOUT_REDIRECT_URI:-}
      AGRONOMY_AGENT_OIDC_SCOPES: openid email profile
      AGRONOMY_AGENT_REDIS_URL: ${AGRONOMY_AGENT_REDIS_URL:?set AGRONOMY_AGENT_REDIS_URL}
      AGRONOMY_AGENT_RATE_LIMIT_BACKEND: redis
      AGRONOMY_AGENT_RATE_LIMIT_FAIL_OPEN: "false"
      AGRONOMY_AGENT_JOB_QUEUE_BACKEND: redis
      AGRONOMY_AGENT_JOB_QUEUE_FAIL_OPEN: "false"
      AGRONOMY_AGENT_JOB_QUEUE_NAME: agronomy:jobs:ingest
      AGRONOMY_AGENT_EVAL_QUEUE_NAME: agronomy:jobs:eval
      AGRONOMY_AGENT_EXPORT_QUEUE_NAME: agronomy:jobs:exports
      AGRONOMY_AGENT_EMBEDDING_QUEUE_NAME: agronomy:jobs:embedding
      AGRONOMY_AGENT_IMAGE_QUEUE_NAME: agronomy:jobs:image
      AGRONOMY_AGENT_OBJECT_STORE_BACKEND: s3
      AGRONOMY_AGENT_OBJECT_STORE_ENDPOINT: ${AGRONOMY_AGENT_OBJECT_STORE_ENDPOINT:?set AGRONOMY_AGENT_OBJECT_STORE_ENDPOINT}
      AGRONOMY_AGENT_OBJECT_STORE_BUCKET: ${AGRONOMY_AGENT_OBJECT_STORE_BUCKET:?set AGRONOMY_AGENT_OBJECT_STORE_BUCKET}
      AGRONOMY_AGENT_OBJECT_STORE_REGION: ${AGRONOMY_AGENT_OBJECT_STORE_REGION:?set AGRONOMY_AGENT_OBJECT_STORE_REGION}
      AGRONOMY_AGENT_OBJECT_STORE_ACCESS_KEY: ${AGRONOMY_AGENT_OBJECT_STORE_ACCESS_KEY:?set AGRONOMY_AGENT_OBJECT_STORE_ACCESS_KEY}
      AGRONOMY_AGENT_OBJECT_STORE_SECRET_KEY: ${AGRONOMY_AGENT_OBJECT_STORE_SECRET_KEY:?set AGRONOMY_AGENT_OBJECT_STORE_SECRET_KEY}
      AGRONOMY_AGENT_ATTACHMENT_SCAN_BACKEND: http
      AGRONOMY_AGENT_ATTACHMENT_SCAN_ENDPOINT: ${AGRONOMY_AGENT_ATTACHMENT_SCAN_ENDPOINT:?set AGRONOMY_AGENT_ATTACHMENT_SCAN_ENDPOINT}
      AGRONOMY_AGENT_ATTACHMENT_SCAN_API_KEY: ${AGRONOMY_AGENT_ATTACHMENT_SCAN_API_KEY:?set AGRONOMY_AGENT_ATTACHMENT_SCAN_API_KEY}
      AGRONOMY_AGENT_STRUCTURED_ACCESS_LOGS: "true"
      AGRONOMY_AGENT_OTEL_ENABLED: "true"
      AGRONOMY_AGENT_OTEL_SERVICE_NAME: agronomy-agent-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    command: ["python", "-m", "agronomy_agent.server.worker", "--interval-seconds", "30", "--run-queued-ingest", "--run-queued-evals", "--run-queued-exports", "--run-queued-embeddings", "--run-queued-images", "--max-jobs", "5"]
    environment:
      AGRONOMY_AGENT_DB_BACKEND: postgres
      AGRONOMY_AGENT_DATABASE_URL: ${AGRONOMY_AGENT_DATABASE_URL:?set AGRONOMY_AGENT_DATABASE_URL}
      AGRONOMY_AGENT_REDIS_URL: ${AGRONOMY_AGENT_REDIS_URL:?set AGRONOMY_AGENT_REDIS_URL}
      AGRONOMY_AGENT_JOB_QUEUE_BACKEND: redis
      AGRONOMY_AGENT_JOB_QUEUE_FAIL_OPEN: "false"
      AGRONOMY_AGENT_JOB_QUEUE_NAME: agronomy:jobs:ingest
      AGRONOMY_AGENT_EVAL_QUEUE_NAME: agronomy:jobs:eval
      AGRONOMY_AGENT_EXPORT_QUEUE_NAME: agronomy:jobs:exports
      AGRONOMY_AGENT_EMBEDDING_QUEUE_NAME: agronomy:jobs:embedding
      AGRONOMY_AGENT_IMAGE_QUEUE_NAME: agronomy:jobs:image
      AGRONOMY_AGENT_OBJECT_STORE_BACKEND: s3
      AGRONOMY_AGENT_OBJECT_STORE_ENDPOINT: ${AGRONOMY_AGENT_OBJECT_STORE_ENDPOINT:?set AGRONOMY_AGENT_OBJECT_STORE_ENDPOINT}
      AGRONOMY_AGENT_OBJECT_STORE_BUCKET: ${AGRONOMY_AGENT_OBJECT_STORE_BUCKET:?set AGRONOMY_AGENT_OBJECT_STORE_BUCKET}
      AGRONOMY_AGENT_OBJECT_STORE_REGION: ${AGRONOMY_AGENT_OBJECT_STORE_REGION:?set AGRONOMY_AGENT_OBJECT_STORE_REGION}
      AGRONOMY_AGENT_OBJECT_STORE_ACCESS_KEY: ${AGRONOMY_AGENT_OBJECT_STORE_ACCESS_KEY:?set AGRONOMY_AGENT_OBJECT_STORE_ACCESS_KEY}
      AGRONOMY_AGENT_OBJECT_STORE_SECRET_KEY: ${AGRONOMY_AGENT_OBJECT_STORE_SECRET_KEY:?set AGRONOMY_AGENT_OBJECT_STORE_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "agronomy_agent.server.worker", "--healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.launch
    ports:
      - "${PHASE6_FRONTEND_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  phase6_postgres:
  phase6_redis:
