name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-phase4-ci.txt
            requirements-benchmark-analysis.txt
            requirements-imagery.txt
            requirements-geospatial.txt
      - name: Install tested backend dependencies
        run: |
          python -m pip install --requirement requirements-phase4-ci.txt
          python -m pip install --requirement requirements-benchmark-analysis.txt
          python -m pip install --editable ".[geospatial-prep,training]"
          python -m pip install --requirement requirements-geospatial.txt
      - name: Audit installed Python dependencies
        run: |
          python -m venv "$RUNNER_TEMP/dependency-audit"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip install --requirement requirements-security.txt
          python -m pip list --format=freeze --exclude agronomy-agent > "$RUNNER_TEMP/installed-dependencies.txt"
          test -s "$RUNNER_TEMP/installed-dependencies.txt"
          "$RUNNER_TEMP/dependency-audit/bin/python" -m pip_audit \
            --requirement "$RUNNER_TEMP/installed-dependencies.txt" \
            --no-deps --disable-pip --strict --progress-spinner off
      - name: Compile Python sources
        run: python -m compileall -q src scripts
      - name: Run backend tests
        run: python -m pytest -q
      - name: Build curated public package
        run: python scripts/build_public_repository.py --destination "$RUNNER_TEMP/open-agronomy-public-package"
      - name: Build and reconstruct split source distribution
        run: |
          PYTHONPATH=. python scripts/build_source_distribution.py build \
            --destination "$RUNNER_TEMP/source-distribution" > "$RUNNER_TEMP/source-distribution-result.json"
          cat "$RUNNER_TEMP/source-distribution-result.json"
          plan_sha=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["plan_sha256"])' "$RUNNER_TEMP/source-distribution-result.json")
          PYTHONPATH=. python scripts/build_source_distribution.py reconstruct \
            --distribution "$RUNNER_TEMP/source-distribution" \
            --destination "$RUNNER_TEMP/reconstructed-public-tree" \
            --expected-plan-sha256 "$plan_sha"
          cd "$RUNNER_TEMP/reconstructed-public-tree"
          PYTHONPATH=src python scripts/audit_runtime_corpus.py

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit high-severity frontend dependencies
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
